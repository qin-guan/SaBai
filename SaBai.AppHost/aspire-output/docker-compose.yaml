services:
  compose-dashboard:
    image: "mcr.microsoft.com/dotnet/nightly/aspire-dashboard:13.6"
    ports:
      - "18888:18888"
    expose:
      - "18889"
      - "18890"
    networks:
      - "aspire"
    restart: "always"
  qdrant:
    image: "docker.io/qdrant/qdrant:v1.18.0"
    environment:
      QDRANT__SERVICE__API_KEY: "${QDRANT_KEY}"
      QDRANT__SERVICE__ENABLE_STATIC_CONTENT: "0"
    ports:
      - "6333:6333"
      - "6334:6334"
    expose:
      - "6334"
      - "6333"
    volumes:
      - type: "volume"
        target: "/qdrant/storage"
        source: "sabai.apphost-993ba38cf5-qdrant-data"
        read_only: false
    networks:
      - "aspire"
  postgres:
    image: "docker.io/library/postgres:18.3"
    command:
      - "-c"
      - "wal_level=logical"
    environment:
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "sabai"
    expose:
      - "5432"
    volumes:
      - type: "volume"
        target: "/var/lib/postgresql"
        source: "sabai.apphost-993ba38cf5-postgres-data"
        read_only: false
    networks:
      - "aspire"
  pgadmin:
    image: "docker.io/dpage/pgadmin4:9.15.0"
    environment:
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_DEFAULT_EMAIL: "admin@domain.com"
      PGADMIN_DEFAULT_PASSWORD: "admin"
    ports:
      - "5050:80"
    expose:
      - "80"
    networks:
      - "aspire"
    configs:
      - source: "pgadmin__pgadmin4_servers.json"
        target: "/pgadmin4/servers.json"
        mode: 0644
  fs:
    image: "rustfs/rustfs:latest"
    environment:
      RUSTFS_VOLUMES: "/data/rustfs0"
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_ACCESS_KEY: "${RUSTFSACCESSKEY}"
      RUSTFS_SECRET_KEY: "${RUSTFSSECRETKEY}"
      RUSTFS_OBS_LOGGER_LEVEL: "info"
    ports:
      - "9001:9001"
    expose:
      - "9000"
      - "9001"
    volumes:
      - type: "volume"
        target: "/data"
        source: "fs-data"
        read_only: false
      - type: "volume"
        target: "/app/logs"
        source: "fs-logs"
        read_only: false
    networks:
      - "aspire"
  api:
    build:
      context: "."
      dockerfile: "SaBai.API/Dockerfile"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${API_PORT}"
      ConnectionStrings__qdrant: "Endpoint=http://qdrant:6334;Key=${QDRANT_KEY}"
      QDRANT_GRPCHOST: "qdrant"
      QDRANT_GRPCPORT: "6334"
      QDRANT_HTTPHOST: "qdrant"
      QDRANT_HTTPPORT: "6333"
      QDRANT_APIKEY: "${QDRANT_KEY}"
      QDRANT_URI: "http://qdrant:6334"
      QDRANT_HTTPURI: "http://qdrant:6333"
      ConnectionStrings__qdrant_http: "Endpoint=http://qdrant:6333;Key=${QDRANT_KEY}"
      ConnectionStrings__sabai: "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=sabai"
      SABAI_HOST: "postgres"
      SABAI_PORT: "5432"
      SABAI_USERNAME: "postgres"
      SABAI_PASSWORD: "${POSTGRES_PASSWORD}"
      SABAI_URI: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/sabai"
      SABAI_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/sabai"
      SABAI_DATABASENAME: "sabai"
      FS_S3: "http://fs:9000"
      services__fs__s3__0: "http://fs:9000"
      ConnectionStrings__fs-sabai: "Endpoint=http://fs:9000;AccessKey=${RUSTFSACCESSKEY};SecretKey=${RUSTFSSECRETKEY};Bucket=sabai"
      Auth__BootstrapAdmin__UserName: "${ADMINUSERNAME}"
      Auth__BootstrapAdmin__Password: "${ADMINPASSWORD}"
      Push__Subject: "${PUSHSUBJECT}"
      Push__PublicKey: "${PUSHPUBLICKEY}"
      Push__PrivateKey: "${PUSHPRIVATEKEY}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://compose-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "api"
    ports:
      - "8080:8080"
    expose:
      - "${API_PORT}"
    depends_on:
      postgres:
        condition: "service_started"
      fs:
        condition: "service_started"
    networks:
      - "aspire"
  powersync:
    image: "journeyapps/powersync-service:latest"
    command:
      - "start"
      - "-r"
      - "unified"
      - "-c"
      - "/config/service.yaml"
    environment:
      PS_SOURCE_PG_URI: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/sabai"
      PS_STORAGE_PG_URI: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/powersync"
      PS_JWKS_URI: "http://api:${API_PORT}/.well-known/jwks.json"
    ports:
      - "8089:8080"
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: "service_started"
      api:
        condition: "service_started"
    networks:
      - "aspire"
    configs:
      - source: "powersync__config_service.yaml"
        target: "/config/service.yaml"
      - source: "powersync__config_sync-config.yaml"
        target: "/config/sync-config.yaml"
  frontend:
    build:
      context: "."
      dockerfile: "SaBai.Web.Nuxt/Dockerfile"
    environment:
      NUXT_API_URL: "http://api:${API_PORT}"
      NUXT_POWERSYNC_URL: "http://powersync:8080"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://compose-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "frontend"
    ports:
      - "3000:3000"
    expose:
      - "3000"
    depends_on:
      api:
        condition: "service_started"
      powersync:
        condition: "service_started"
    networks:
      - "aspire"
networks:
  aspire:
    driver: "bridge"
volumes:
  sabai.apphost-993ba38cf5-qdrant-data:
    driver: "local"
  sabai.apphost-993ba38cf5-postgres-data:
    driver: "local"
  fs-data:
    driver: "local"
  fs-logs:
    driver: "local"
configs:
  pgadmin__pgadmin4_servers.json:
    content: "{\n  \"Servers\": {\n    \"1\": {\n      \"Name\": \"postgres\",\n      \"Group\": \"Servers\",\n      \"Host\": \"postgres\",\n      \"Port\": 5432,\n      \"Username\": \"postgres\",\n      \"SSLMode\": \"prefer\",\n      \"MaintenanceDB\": \"postgres\",\n      \"PasswordExecCommand\": \"echo \\u00278R834zjqYbSDw4bx~q7!RA\\u0027\"\n    }\n  }\n}"
  powersync__config_service.yaml:
    content: "replication:\n  connections:\n    - type: postgresql\n      uri: !env PS_SOURCE_PG_URI\n\nstorage:\n  type: postgresql\n  uri: !env PS_STORAGE_PG_URI\n\nport: 8080\n\nsync_config:\n  path: /config/sync-config.yaml\n\nclient_auth:\n  jwks_uri: !env PS_JWKS_URI\n  audience:\n    - powersync\n"
  powersync__config_sync-config.yaml:
    content: "config:\n  edition: 3\n\nstreams:\n  clinic:\n    auto_subscribe: true\n    queries:\n      - >\n        SELECT\n          \"Id\" AS id,\n          \"Version\" AS version,\n          \"UpdatedAt\" AS updated_at,\n          \"Code\" AS code,\n          \"Name\" AS name,\n          \"ColorHex\" AS color_hex,\n          \"IsVisible\" AS is_visible,\n          \"CreatedAt\" AS created_at\n        FROM \"VillageCodes\"\n      - >\n        SELECT\n          \"Id\" AS id,\n          \"UserName\" AS user_name,\n          \"Nickname\" AS nickname,\n          \"CreatedAt\" AS created_at\n        FROM \"StaffUsers\"\n      - >\n        SELECT\n          \"Id\" AS id,\n          \"Version\" AS version,\n          \"UpdatedAt\" AS updated_at,\n          \"Number\" AS number,\n          \"VillageCodeId\" AS village_code_id,\n          \"Name\" AS name,\n          \"IdentificationNumber\" AS identification_number,\n          \"ContactNo\" AS contact_no,\n          \"Gender\" AS gender,\n          \"DateOfBirth\" AS date_of_birth,\n          \"DrugAllergy\" AS drug_allergy,\n          \"HasPoorCard\" AS has_poor_card,\n          \"HasBS2Card\" AS has_bs2_card,\n          \"HasSabaiCard\" AS has_sabai_card,\n          \"ToGetReport\" AS to_get_report,\n          \"PatientImagePublicId\" AS patient_image_public_id,\n          \"RekognitionFaceId\" AS rekognition_face_id,\n          \"CreatedAt\" AS created_at\n        FROM \"Patients\"\n      - >\n        SELECT\n          \"Id\" AS id,\n          \"Version\" AS version,\n          \"UpdatedAt\" AS updated_at,\n          \"PatientId\" AS patient_id,\n          \"VillageCodeId\" AS village_code_id,\n          \"Date\" AS date,\n          \"Status\" AS status\n        FROM \"Visits\"\n      - >\n        SELECT\n          \"Id\" AS id,\n          \"Version\" AS version,\n          \"UpdatedAt\" AS updated_at,\n          \"RecordedAt\" AS recorded_at,\n          \"VisitId\" AS visit_id,\n          \"Height\" AS height,\n          \"Weight\" AS weight,\n          \"Temperature\" AS temperature,\n          \"Systolic\" AS systolic,\n          \"Diastolic\" AS diastolic,\n          \"HeartRate\" AS heart_rate,\n          \"HemocueCount\" AS hemocue_count,\n          \"DiabetesMellitus\" AS diabetes_mellitus,\n          \"UrineTest\" AS urine_test,\n          \"BloodGlucoseNonFasting\" AS blood_glucose_non_fasting,\n          \"BloodGlucoseFasting\" AS blood_glucose_fasting,\n          \"Hba1c\" AS hba1c,\n          \"Others\" AS others\n        FROM \"Vitals\"\n      - >\n        SELECT\n          \"Id\" AS id,\n          \"Version\" AS version,\n          \"UpdatedAt\" AS updated_at,\n          \"VitalsId\" AS vitals_id,\n          \"Pubarche\" AS pubarche,\n          \"PubarcheAge\" AS pubarche_age,\n          \"Thelarche\" AS thelarche,\n          \"ThelarcheAge\" AS thelarche_age,\n          \"Menarche\" AS menarche,\n          \"MenarcheAge\" AS menarche_age,\n          \"VoiceChange\" AS voice_change,\n          \"VoiceChangeAge\" AS voice_change_age,\n          \"TesticularGrowth\" AS testicular_growth,\n          \"TesticularGrowthAge\" AS testicular_growth_age,\n          \"AdditionalNotes\" AS additional_notes\n        FROM \"PubertyAssessments\"\n      - >\n        SELECT\n          \"Id\" AS id,\n          \"Version\" AS version,\n          \"UpdatedAt\" AS updated_at,\n          \"VitalsId\" AS vitals_id,\n          \"GrossMotor\" AS gross_motor,\n          \"RedReflex\" AS red_reflex,\n          \"Scoliosis\" AS scoliosis,\n          \"Pallor\" AS pallor,\n          \"OralCavity\" AS oral_cavity,\n          \"Heart\" AS heart,\n          \"Abdomen\" AS abdomen,\n          \"Lungs\" AS lungs,\n          \"HernialOrifices\" AS hernial_orifices\n        FROM \"ChildVitals\"\n      - >\n        SELECT\n          \"Id\" AS id,\n          \"Version\" AS version,\n          \"UpdatedAt\" AS updated_at,\n          \"RecordedAt\" AS recorded_at,\n          \"VisitId\" AS visit_id,\n          \"LeftEyeDegree\" AS left_eye_degree,\n          \"RightEyeDegree\" AS right_eye_degree,\n          \"LeftEyePinhole\" AS left_eye_pinhole,\n          \"RightEyePinhole\" AS right_eye_pinhole,\n          \"LeftAstigmatism\" AS left_astigmatism,\n          \"RightAstigmatism\" AS right_astigmatism,\n          \"Comments\" AS comments,\n          \"LeftPrescribedGlassesDegree\" AS left_prescribed_glasses_degree,\n          \"RightPrescribedGlassesDegree\" AS right_prescribed_glasses_degree\n        FROM \"Eyesights\"\n      - >\n        SELECT\n          \"Id\" AS id,\n          \"Version\" AS version,\n          \"UpdatedAt\" AS updated_at,\n          \"RecordedAt\" AS recorded_at,\n          \"VisitId\" AS visit_id,\n          \"PreviousDentalVisit\" AS previous_dental_visit,\n          \"PreviousDentalTreatment\" AS previous_dental_treatment,\n          \"Toothache\" AS toothache,\n          \"Extraction\" AS extraction,\n          \"DentalTrauma\" AS dental_trauma,\n          \"CurrentToothache\" AS current_toothache,\n          \"ToothSensitivity\" AS tooth_sensitivity,\n          \"BleedingGums\" AS bleeding_gums,\n          \"BrushingFrequency\" AS brushing_frequency,\n          \"FluorideToothpaste\" AS fluoride_toothpaste,\n          \"SugarConsumption\" AS sugar_consumption,\n          \"OtherDentalHistory\" AS other_dental_history,\n          \"ChiefComplaint\" AS chief_complaint,\n          \"FacialSymmetry\" AS facial_symmetry,\n          \"FacialSwelling\" AS facial_swelling,\n          \"Lymphadenopathy\" AS lymphadenopathy,\n          \"MouthOpening\" AS mouth_opening,\n          \"OralHygiene\" AS oral_hygiene,\n          \"Plaque\" AS plaque,\n          \"Calculus\" AS calculus,\n          \"GingivalCondition\" AS gingival_condition,\n          \"Caries\" AS caries,\n          \"MissingTeeth\" AS missing_teeth,\n          \"FracturedTeeth\" AS fractured_teeth,\n          \"MucosalLesions\" AS mucosal_lesions,\n          \"Malocclusion\" AS malocclusion,\n          \"Diagnoses\" AS diagnoses,\n          \"FluorideDone\" AS fluoride_done,\n          \"FluorideDate\" AS fluoride_date,\n          \"FluorideOperator\" AS fluoride_operator,\n          \"FluorideToothNumbers\" AS fluoride_tooth_numbers,\n          \"SealantDone\" AS sealant_done,\n          \"SealantDate\" AS sealant_date,\n          \"SealantOperator\" AS sealant_operator,\n          \"SealantToothNumbers\" AS sealant_tooth_numbers,\n          \"SdfDone\" AS sdf_done,\n          \"SdfDate\" AS sdf_date,\n          \"SdfOperator\" AS sdf_operator,\n          \"SdfToothNumbers\" AS sdf_tooth_numbers,\n          \"ScalingDone\" AS scaling_done,\n          \"ScalingDate\" AS scaling_date,\n          \"ScalingOperator\" AS scaling_operator,\n          \"ScalingToothNumbers\" AS scaling_tooth_numbers,\n          \"ReferredFor\" AS referred_for,\n          \"ReferralPriority\" AS referral_priority,\n          \"ReferralNotes\" AS referral_notes,\n          \"RecommendedFacility\" AS recommended_facility,\n          \"Remarks\" AS remarks,\n          \"ImageFileId\" AS image_file_id\n        FROM \"DentalConsults\"\n      - >\n        SELECT\n          \"Id\" AS id,\n          \"Version\" AS version,\n          \"UpdatedAt\" AS updated_at,\n          \"Date\" AS date,\n          \"PastMedicalHistory\" AS past_medical_history,\n          \"Consultation\" AS consultation,\n          \"TreatmentPlan\" AS treatment_plan,\n          \"ReferredFor\" AS referred_for,\n          \"ReferralNotes\" AS referral_notes,\n          \"Remarks\" AS remarks,\n          \"DoctorId\" AS doctor_id,\n          \"VisitId\" AS visit_id\n        FROM \"Consults\"\n      - >\n        SELECT\n          \"Id\" AS id,\n          \"Version\" AS version,\n          \"UpdatedAt\" AS updated_at,\n          \"Details\" AS details,\n          \"Category\" AS category,\n          \"CodingSystem\" AS coding_system,\n          \"Code\" AS code,\n          \"CodeDisplay\" AS code_display,\n          \"ConsultId\" AS consult_id\n        FROM \"Diagnoses\"\n      - >\n        SELECT\n          \"Id\" AS id,\n          \"Version\" AS version,\n          \"UpdatedAt\" AS updated_at,\n          \"Name\" AS name,\n          \"Remarks\" AS remarks,\n          \"IsActive\" AS is_active,\n          \"CreatedAt\" AS created_at\n        FROM \"ReferralPartners\"\n      - >\n        SELECT\n          \"Id\" AS id,\n          \"Version\" AS version,\n          \"UpdatedAt\" AS updated_at,\n          \"ReferredFor\" AS referred_for,\n          \"ReferralNotes\" AS referral_notes,\n          \"ReferralState\" AS referral_state,\n          \"ReferralOutcome\" AS referral_outcome,\n          \"ConsultId\" AS consult_id,\n          \"CreatedAt\" AS created_at,\n          \"ReferredToId\" AS referred_to_id,\n          \"MemberInChargeId\" AS member_in_charge_id,\n          \"GuardiansContacted\" AS guardians_contacted,\n          \"ClassOfService\" AS class_of_service,\n          \"DescriptionOfService\" AS description_of_service,\n          \"PatientSummaryFromScreening\" AS patient_summary_from_screening,\n          \"RemarksAtBooth\" AS remarks_at_booth,\n          \"MemberOnRunId\" AS member_on_run_id,\n          \"PresentAtReferralParty\" AS present_at_referral_party,\n          \"ReferralPartyResults\" AS referral_party_results,\n          \"FollowUp\" AS follow_up,\n          \"DoctorsUpdated\" AS doctors_updated,\n          \"AmountPaidUsd\" AS amount_paid_usd,\n          \"AmountPaidRiels\" AS amount_paid_riels,\n          \"MemberWhoPaidId\" AS member_who_paid_id\n        FROM \"Referrals\"\n      - >\n        SELECT\n          \"Id\" AS id,\n          \"Name\" AS name,\n          \"NormalizedName\" AS normalized_name,\n          \"CreatedAt\" AS created_at\n        FROM \"Tags\"\n      - >\n        SELECT\n          \"Id\" AS id,\n          \"PatientId\" AS patient_id,\n          \"TagId\" AS tag_id\n        FROM \"PatientTags\"\n      - >\n        SELECT\n          \"Id\" AS id,\n          \"Version\" AS version,\n          \"UpdatedAt\" AS updated_at,\n          \"Name\" AS name,\n          \"UnitOfMeasurement\" AS unit_of_measurement,\n          \"FallBelow\" AS fall_below,\n          \"Remarks\" AS remarks,\n          \"RxNormCode\" AS rx_norm_code,\n          \"AtcCode\" AS atc_code\n        FROM \"MedicationActiveIngredients\"\n      - >\n        SELECT\n          \"Id\" AS id,\n          \"Version\" AS version,\n          \"UpdatedAt\" AS updated_at,\n          \"Name\" AS name,\n          \"ActiveIngredientId\" AS active_ingredient_id,\n          \"Remarks\" AS remarks\n        FROM \"MedicationBrands\"\n      - >\n        SELECT\n          \"Id\" AS id,\n          \"Version\" AS version,\n          \"UpdatedAt\" AS updated_at,\n          \"MedicationBrandId\" AS medication_brand_id,\n          \"Quantity\" AS quantity,\n          \"Expiry\" AS expiry,\n          \"Location\" AS location,\n          \"StockStatus\" AS stock_status,\n          \"Remarks\" AS remarks\n        FROM \"MedicationStocks\"\n      - >\n        SELECT\n          \"Id\" AS id,\n          \"Version\" AS version,\n          \"UpdatedAt\" AS updated_at,\n          \"StockId\" AS stock_id,\n          \"Field\" AS field,\n          \"PreviousValue\" AS previous_value,\n          \"NewValue\" AS new_value,\n          \"UserId\" AS user_id,\n          \"CreatedAt\" AS created_at\n        FROM \"StockChanges\"\n      - >\n        SELECT\n          \"Id\" AS id,\n          \"Version\" AS version,\n          \"UpdatedAt\" AS updated_at,\n          \"ConsultId\" AS consult_id,\n          \"MedicationBrandId\" AS medication_brand_id,\n          \"DosageInstructions\" AS dosage_instructions,\n          \"Remarks\" AS remarks,\n          \"Status\" AS status,\n          \"Quantity\" AS quantity,\n          \"ApprovedById\" AS approved_by_id,\n          \"ApprovedAt\" AS approved_at,\n          \"CreatedAt\" AS created_at\n        FROM \"Orders\"\n      - >\n        SELECT\n          \"Id\" AS id,\n          \"Version\" AS version,\n          \"UpdatedAt\" AS updated_at,\n          \"PatientId\" AS patient_id,\n          \"FileName\" AS file_name,\n          \"StoredFileName\" AS stored_file_name,\n          \"Description\" AS description,\n          \"SizeBytes\" AS size_bytes,\n          \"IsDeleted\" AS is_deleted,\n          \"CreatedAt\" AS created_at\n        FROM \"Files\"\n"
